[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onekommafive"
version = "1.1.9"
description = "Python API client for the 1KOMMA5° Heartbeat API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Markus Rebbert", email = "code@rebbert.de" },
]
keywords = ["1komma5", "heartbeat", "energy", "home-automation", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyJWT>=2.8",
    "aiohttp>=3.10",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    # aioresponses (<=0.7.8) doesn't yet supply the ``stream_writer`` kwarg
    # that aiohttp 3.14 requires in ClientResponse.__init__. We patch it
    # in tests/conftest.py (see issue #21, upstream fix in
    # aioresponses#288). No aiohttp version pin here so downstream
    # (Home Assistant on 3.13.3) resolves cleanly.
    "aioresponses>=0.7",
    "hypothesis>=6.0",
    "interrogate>=1.7",
    "mypy>=1.11",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-mock>=3.12",
    "ruff>=0.8",
    "syrupy>=4.6",
]

[project.scripts]
1k5 = "onekommafive.cli:main"

[tool.setuptools.packages.find]
include = ["onekommafive*"]

[tool.setuptools.package-data]
onekommafive = ["py.typed"]

[project.urls]
Homepage = "https://github.com/mrebbert/1komma5-api"
Repository = "https://github.com/mrebbert/1komma5-api"
Changelog = "https://github.com/mrebbert/1komma5-api/releases"
Issues = "https://github.com/mrebbert/1komma5-api/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# -ra prints a short summary of every non-pass outcome at the end of
# the run. --strict-markers rejects typos in @pytest.mark.* decorators
# instead of silently ignoring them.
addopts = "--cov --cov-report=term-missing -ra --strict-markers"

[tool.coverage.run]
source = ["onekommafive"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
# `ruff format` enforces line width; E501 only flags long string
# literals and docstrings the formatter can't wrap. See the
# python-quality-baseline skill's Formatting section.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B011: `assert False` is explicit test intent, not a bug.
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["onekommafive"]

[tool.interrogate]
# Docstring-coverage gate for the SDK surface. Measures presence, not
# style (ruff format handles style). Dataclass dunder methods, magic
# methods and private helpers do not need prose - their names and
# types already describe them.
ignore-init-method = true           # class docstring covers __init__
ignore-init-module = true           # __init__.py is re-exports
ignore-magic = true                 # dunder methods seldom need prose
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
# from_dict classmethods are mechanical constructor delegates whose
# name and type signature already describe them; a docstring here
# would just repeat "Construct from a raw API response dictionary"
# on every single model.
ignore-regex = ["from_dict"]
fail-under = 85
exclude = [
    "tests",
    "scripts",
    # CLI argparse glue - names and types self-describe each cmd_*.
    "onekommafive/cli.py",
    # sync is a mechanically generated facade over async methods;
    # docstrings live on the async counterparts.
    "onekommafive/sync.py",
]
verbose = 1
