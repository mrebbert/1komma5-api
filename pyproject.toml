[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onekommafive"
version = "1.0.0"
description = "Python API client for the 1KOMMA5° Heartbeat API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Markus Rebbert", email = "code@rebbert.de" },
]
keywords = ["1komma5", "heartbeat", "energy", "home-automation", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyJWT>=2.8",
    "aiohttp>=3.10,<3.13",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "ruff>=0.8",
]

[project.scripts]
1k5 = "onekommafive.cli:main"

[tool.setuptools.packages.find]
include = ["onekommafive*"]

[tool.setuptools.package-data]
onekommafive = ["py.typed"]

[project.urls]
Homepage = "https://github.com/mrebbert/1komma5-api"
Repository = "https://github.com/mrebbert/1komma5-api"
Changelog = "https://github.com/mrebbert/1komma5-api/releases"
Issues = "https://github.com/mrebbert/1komma5-api/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"onekommafive/__init__.py" = ["E501"]
"onekommafive/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["onekommafive"]

[[tool.mypy.overrides]]
# The CLI is not part of the strict-typed public surface (it's a
# convenience script, not a library). Full annotation of its ~1100 lines
# of interactive argparse plumbing offers little value to consumers.
module = "onekommafive.cli"
ignore_errors = true
